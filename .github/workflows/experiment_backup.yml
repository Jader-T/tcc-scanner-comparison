name: Experimento SCA

on:
  workflow_dispatch:
    inputs:
      imagem:
        description: 'Imagem com digest fixo'
        required: true
        default: 'debian@sha256:58ce6f1271ae1c8a2006ff7d3e54e9874d839f573d8009c20154ad0f2fb0a225'

jobs:
  preparar:
    runs-on: [self-hosted, lab-tcc]
    steps:
      - uses: actions/checkout@v4
      - name: Pull da imagem-alvo
        run: docker pull ${{ inputs.imagem }}

  trivy:
    needs: preparar
    runs-on: [self-hosted, lab-tcc]
    steps:
      - name: Varredura Trivy
        run: |
          mkdir -p resultados
          INICIO=$(date +%s%N)
          trivy image --skip-db-update --format json \
                --output resultados/trivy.json "${{ inputs.imagem }}"
          FIM=$(date +%s%N)
          echo "trivy,$(( (FIM-INICIO)/1000000 ))" >> resultados/tempos.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: resultados/

  grype:
    needs: trivy
    runs-on: [self-hosted, lab-tcc]
    env:
      GRYPE_DB_AUTO_UPDATE: "false"
    steps:
      - name: Varredura Grype
        run: |
          mkdir -p resultados
          INICIO=$(date +%s%N)
          grype "${{ inputs.imagem }}" -o json > resultados/grype.json
          FIM=$(date +%s%N)
          echo "grype,$(( (FIM-INICIO)/1000000 ))" >> resultados/tempos.csv
      - uses: actions/upload-artifact@v4
        with:
          name: grype
          path: resultados/

  clair:
    needs: grype
    runs-on: [self-hosted, lab-tcc]
    steps:
      - name: Varredura Clair
        run: |
          mkdir -p resultados
          ~/clair/clair-scan.sh "${{ inputs.imagem }}" resultados/clair.json \
            | tee resultados/clair-metricas.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clair
          path: resultados/
